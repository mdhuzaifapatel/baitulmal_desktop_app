<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Baitulmal Trust</title>
    <link href="/static/css/bootstrap.min.css" rel="stylesheet" />
    <link href="/static/css/bootstrap-icons.css" rel="stylesheet" />
    <!-- Fonts are handled via system stack for offline reliability -->

    <style>
      :root {
        --primary-color: #0F766E;
        --primary-hover: #115E59;
        --bg-color: #F1F5F9;
        --card-bg: #FFFFFF;
        --text-color: #334155;
      }
      
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .arabic-text {
        font-family: "Traditional Arabic", "Sakkal Majalla", "Arabic Typesetting", "Simplified Arabic", "Times New Roman", serif;
      }
      .login-card {
        background: var(--card-bg);
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        padding: 2.5rem 2rem;
        width: 100%;
        max-width: 420px;
      }
      .logo-container {
        text-align: center;
        margin-bottom: 1.5rem;
      }
      .logo-container img {
        max-height: 100px;
        width: auto;
      }
      .trust-name {
        text-align: center;
        margin-bottom: 2rem;
      }
      .trust-name h4 {
        margin: 0;
        font-weight: 700;
        color: var(--primary-color);
        letter-spacing: -0.5px;
      }
      .trust-name p {
        margin: 0;
        color: #64748b;
        font-size: 0.95rem;
        margin-top: 0.25rem;
      }
      .form-control {
        border-radius: 8px;
        padding: 0.6rem 1rem;
        border: 1px solid #cbd5e1;
      }
      .form-control:focus {
        border-color: var(--primary-color);
        box-shadow: 0 0 0 0.25rem rgba(15, 118, 110, 0.25);
      }
      .input-group-text {
        background-color: #f1f5f9;
        border: 1px solid #cbd5e1;
        color: #64748b;
        border-radius: 8px 0 0 8px;
      }
      .form-control {
        border-radius: 0 8px 8px 0;
      }
      .btn-primary {
        background-color: var(--primary-color);
        border-color: var(--primary-color);
        border-radius: 8px;
        padding: 0.6rem;
        font-weight: 500;
        transition: all 0.2s;
        margin-top: 0.5rem;
      }
      .btn-primary:hover {
        background-color: var(--primary-hover);
        border-color: var(--primary-hover);
        transform: translateY(-1px);
      }
    </style>
  </head>
  <body>
    <div class="login-card">
      <div class="text-center mt-1 mb-2">
        <div class="fs-4 arabic-text" style="color: var(--primary-color);">بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</div>
      </div>
      <div class="logo-container">
        <img src="/static/logo.png" alt="Baitulmal Trust Logo" />
      </div>
      <div class="trust-name">
        <h4>Hazrat Sher-E-Sawar (RH) Baitulmal Trust®</h4>
        <p>Financial Ledger</p>
      </div>

      {% if error %}
      <div class="alert alert-danger" role="alert">{{ error }}</div>
      {% endif %}

      <form method="post" action="/login">
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person"></i></span>
            <input
              type="text"
              name="username"
              id="username"
              class="form-control"
              required
              autofocus
            />
          </div>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input
              type="password"
              name="password"
              id="password"
              class="form-control"
              required
            />
          </div>
        </div>
        <button type="submit" class="btn btn-primary w-100">Login</button>
      </form>

      <div class="text-center mt-3">
        <small class="text-muted">Reg. No. BK-IV-119/17-18</small>
      </div>
    </div>
  </body>
</html>
