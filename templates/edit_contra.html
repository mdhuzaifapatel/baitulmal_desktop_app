{% extends "base.html" %}

{% block content %}
<div class="row mb-4">
  <div class="col-12">
    <h2><i class="bi bi-pencil-square"></i> Edit Contra Entry</h2>
  </div>
</div>

<div class="card">
  <div class="card-body">
    <form action="/edit-contra/{{ entry.id }}" method="POST">
      <div class="row mb-3">
        <div class="col-md-6">
          <label class="form-label">Date</label>
          <input type="date" name="date" class="form-control" value="{{ entry.date.strftime('%Y-%m-%d') }}" required>
        </div>
        <div class="col-md-6">
          <label class="form-label">Amount</label>
          <div class="input-group">
            <span class="input-group-text">₹</span>
            <input type="number" step="0.01" name="amount" id="amount" class="form-control" value="{{ entry.amount }}" oninput="formatAmountDisplay()" required>
          </div>
          <div id="amount-formatted" class="form-text text-primary fw-bold"></div>
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-6">
          <label class="form-label">From (Withdraw from)</label>
          <select name="from_mode_id" class="form-select" required>
            {% for mode in payment_modes %}
            <option value="{{ mode.id }}" {% if mode.id == entry.from_payment_mode_id %}selected{% endif %}>{{ mode.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">To (Deposit to)</label>
          <select name="to_mode_id" class="form-select" required>
            {% for mode in payment_modes %}
            <option value="{{ mode.id }}" {% if mode.id == entry.to_payment_mode_id %}selected{% endif %}>{{ mode.name }}</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Notes</label>
        <textarea name="notes" class="form-control" rows="3">{{ entry.notes }}</textarea>
      </div>

      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary">Update Entry</button>
        <a href="/contra" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>

<script>
  function formatAmountDisplay() {
    const val = document.getElementById('amount').value;
    if (!val) {
      document.getElementById('amount-formatted').innerText = '';
      return;
    }
    const amount = parseFloat(val);
    const formatted = new Intl.NumberFormat('en-IN', {
      style: 'currency',
      currency: 'INR',
      minimumFractionDigits: 2
    }).format(amount);
    document.getElementById('amount-formatted').innerText = formatted;
  }
  window.onload = formatAmountDisplay;
</script>
{% endblock %}
